services:
  - type: web
    name: vent-fast
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: vent-d6010
      - key: FIRESTORE_DATABASE_ID
        value: default
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
