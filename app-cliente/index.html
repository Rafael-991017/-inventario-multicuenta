<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encuentra tu producto · Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B2A41; --navy-light:#28405e; --cream:#F7F5F0; --paper:#FFFFFF;
    --amber:#E0A458; --amber-dark:#C4863C; --green:#3F6C51; --red:#B14A42;
    --ink:#1B2A41; --muted:#6B7280; --line:#E4E0D6;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--cream);color:var(--ink);padding-bottom:88px;}
  h1,h2,h3{font-family:'Sora',sans-serif;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}

  header{background:var(--navy);color:#fff;padding:18px 16px 18px;border-radius:0 0 20px 20px;}
  header .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);}
  header h1{font-size:24px;margin-top:2px;}
  .search-bar{margin-top:16px;display:flex;gap:8px;}
  .search-bar input{flex:1;padding:14px 16px;border-radius:14px;border:none;font-size:14px;font-family:inherit;box-shadow:0 3px 12px rgba(0,0,0,.08);}
  .search-bar input:focus{outline:2px solid var(--amber);}

  .container{max-width:760px;margin:0 auto;padding:16px;}
  .section-title{font-size:17px;color:var(--ink);margin:8px 4px 12px;font-weight:700;}

  #results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
  .product-card{background:var(--paper);border-radius:16px;padding:10px;margin:0;box-shadow:0 2px 10px rgba(36,50,71,.08);cursor:pointer;overflow:hidden;}
  .product-card:hover{box-shadow:0 4px 14px rgba(27,42,65,.1);}
  .product-card h3{font-size:14px;margin-top:10px;}
  .product-card .cat{color:var(--muted);font-size:12px;margin-top:2px;}
  .product-card .best-price{margin-top:10px;display:flex;justify-content:space-between;align-items:center;}
  .best-price .price{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;color:var(--green);}
  .product-image{width:100%;height:132px;object-fit:cover;border-radius:12px;background:#edf1f5;display:block;}
  .best-price .store-count{font-size:12px;color:var(--muted);}

  .empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty-state .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber-dark);}

  .overlay{display:none;position:fixed;inset:0;background:var(--cream);z-index:40;overflow-y:auto;}
  .overlay-header{background:var(--navy);color:#fff;padding:18px 16px;display:flex;align-items:center;gap:12px;}
  .back-btn{background:rgba(255,255,255,.12);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;}
  .store-option{background:var(--paper);border-radius:8px;padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
  .store-option .store-name{font-weight:600;font-size:14px;}
  .store-option .store-addr{font-size:12px;color:var(--muted);margin-top:2px;}
  .store-option .badge{display:inline-block;margin-top:6px;font-size:11px;padding:2px 8px;border-radius:12px;background:#E4EEE8;color:var(--green);font-weight:600;}
  .store-option .price-col{text-align:right;}
  .store-option .price{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:17px;}
  .store-option .stock{font-size:11px;color:var(--muted);}
  .quantity-control{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:8px;}
  .quantity-control button{width:24px;height:24px;border:1px solid var(--line);border-radius:50%;background:var(--cream);color:var(--navy);font-weight:700;cursor:pointer;}
  .quantity-control input{width:42px;padding:4px;border:1px solid var(--line);border-radius:4px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .add-btn{margin-top:8px;background:var(--amber);border:none;color:var(--navy);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;}

  .cart-bar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(760px,calc(100% - 28px));background:var(--navy);color:#fff;padding:14px 18px;display:none;justify-content:space-between;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.2);border-radius:16px;z-index:30;}
  .cart-bar .info{font-size:13px;}
  .cart-bar .total{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px;}
  .cart-bar button{background:var(--amber);border:none;color:var(--navy);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;cursor:pointer;}
  @media(max-width:380px){#results{gap:10px}.product-image{height:112px}.product-card{padding:8px}}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(27,42,65,.5);align-items:flex-end;justify-content:center;z-index:60;}
  .modal{background:var(--paper);padding:26px 22px;border-radius:16px 16px 0 0;width:100%;max-width:520px;}
  .modal h3{margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500;}
  .field input, .field select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:6px;font-size:14px;font-family:inherit;background:var(--cream);}
  .delivery-toggle{display:flex;gap:8px;margin-bottom:14px;}
  .delivery-toggle button{flex:1;padding:10px;border-radius:6px;border:1.5px solid var(--line);background:var(--paper);font-size:13px;cursor:pointer;font-weight:600;}
  .delivery-toggle button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .cart-item-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);}
  .btn-confirm{width:100%;padding:13px;background:var(--amber);border:none;border-radius:8px;font-weight:700;font-size:14px;color:var(--navy);cursor:pointer;margin-top:10px;}
  .success-box{text-align:center;padding:30px 10px;}
  .success-box .check{font-size:40px;margin-bottom:10px;}
</style>
</head>
<body>

<header>
  <span class="eyebrow">Disponibilidad en tiendas cercanas</span>
  <h1>¿Qué estás buscando?</h1>
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="Buscar producto..." oninput="onSearch(this.value)">
  </div>
</header>

<div class="container">
  <div class="section-title" id="results-title">Productos</div>
  <div id="results"></div>
</div>

<div class="overlay" id="detail-overlay">
  <div class="overlay-header">
    <button class="back-btn" onclick="closeDetail()">←</button>
    <div>
      <div style="font-size:15px;font-weight:600;" id="detail-name"></div>
      <div style="font-size:12px;opacity:.7;">Comparado en tiendas disponibles</div>
    </div>
  </div>
  <div class="container" id="detail-stores"></div>
</div>

<div class="cart-bar" id="cart-bar">
  <div class="info">
    <div id="cart-count">0 productos</div>
    <div class="total" id="cart-total">$0</div>
  </div>
  <button onclick="openCheckout()">Ver pedido</button>
</div>

<div class="modal-overlay" id="checkout-modal">
  <div class="modal" id="checkout-content"></div>
</div>

<script>
const API_URL = window.Capacitor
  ? 'https://vent-fast.onrender.com'
  : 'https://vent-fast.onrender.com';
let cart = [];
let currentStoreForCart = null;

async function onSearch(q){
  if(q.length === 1){ return; }
  const endpoint = q.length < 2 ? '/products' : `/products?q=${encodeURIComponent(q)}`;
  try{
    const res = await fetch(`${API_URL}${endpoint}`);
    if(!res.ok) throw new Error('No se pudo consultar el catálogo');
    const products = await res.json();
    document.getElementById('results-title').textContent = q.length < 2 ? 'Productos disponibles' : `Resultados para "${q}"`;
    renderResults(products);
  }catch(error){
    document.getElementById('results-title').textContent = 'No se pudo conectar';
    document.getElementById('results').innerHTML = `<div class="empty-state"><span class="eyebrow">API no disponible</span><p>Revisa que el servidor esté encendido y vuelve a intentarlo.</p></div>`;
  }
}

async function renderResults(products){
  const box = document.getElementById('results');
  if(products.length === 0){
    box.innerHTML = `<div class="empty-state"><span class="eyebrow">Sin resultados</span><p>No encontramos ese producto en ninguna tienda.</p></div>`;
    return;
  }
  const cards = await Promise.all(products.map(async p => {
    const availRes = await fetch(`${API_URL}/products/${p.id}/availability`);
    const avail = await availRes.json();
    return {product: p, availability: avail};
  }));

  box.innerHTML = cards.map(c => {
    if(c.availability.length === 0){
      return `<div class="product-card" style="opacity:.5;">
        <img class="product-image" src="${c.product.image_url || 'https://placehold.co/600x400/e9eef4/718096?text=Sin+imagen'}" alt="${c.product.name}">
        <h3>${c.product.name}</h3><div class="cat">${c.product.category||''}</div>
        <div class="best-price"><span class="store-count">Sin stock en ninguna tienda</span></div>
      </div>`;
    }
    const cheapest = c.availability.reduce((a,b) => a.price < b.price ? a : b);
    return `<div class="product-card" onclick="openDetail(${c.product.id}, '${c.product.name.replace(/'/g,"")}')">
      <img class="product-image" src="${c.product.image_url || 'https://placehold.co/600x400/e9eef4/718096?text=Sin+imagen'}" alt="${c.product.name}">
      <h3>${c.product.name}</h3>
      <div class="cat">${c.product.category || ''}</div>
      <div class="best-price">
        <span class="price">Desde $${cheapest.price.toLocaleString('es-CO')}</span>
        <span class="store-count">${c.availability.length} tienda${c.availability.length>1?'s':''}</span>
      </div>
    </div>`;
  }).join('');
}

async function openDetail(productId, name){
  document.getElementById('detail-name').textContent = name;
  document.getElementById('detail-overlay').style.display = 'block';
  const res = await fetch(`${API_URL}/products/${productId}/availability`);
  const stores = await res.json();
  stores.sort((a,b) => a.price - b.price);
  document.getElementById('detail-stores').innerHTML = stores.map(s => `
    <div class="store-option">
      <div>
        <div class="store-name">${s.store_name}</div>
        <div class="store-addr">${s.address || ''}</div>
        ${s.offers_delivery ? '<span class="badge">Ofrece domicilio</span>' : ''}
      </div>
      <div class="price-col">
        <div class="price">$${s.price.toLocaleString('es-CO')}</div>
        <div class="stock">${s.stock} disponibles</div>
        <div class="quantity-control">
          <button type="button" onclick="changeQuantity(${s.store_id}, -1, ${s.stock})">−</button>
          <input type="number" id="quantity-${s.store_id}" min="1" max="${s.stock}" value="1" aria-label="Cantidad">
          <button type="button" onclick="changeQuantity(${s.store_id}, 1, ${s.stock})">+</button>
        </div>
        <button class="add-btn" onclick="addToCart(${productId}, '${name.replace(/'/g,"")}', ${s.store_id}, '${s.store_name.replace(/'/g,"")}', ${s.price}, document.getElementById('quantity-${s.store_id}').value, ${s.stock})">Agregar</button>
      </div>
    </div>
  `).join('');
}
function closeDetail(){ document.getElementById('detail-overlay').style.display = 'none'; }

function changeQuantity(storeId, amount, max){
  const input = document.getElementById(`quantity-${storeId}`);
  input.value = Math.min(max, Math.max(1, parseInt(input.value || 1) + amount));
}

function addToCart(productId, name, storeId, storeName, price, quantity, stock){
  quantity = parseInt(quantity, 10);
  if(!Number.isInteger(quantity) || quantity < 1){ alert('La cantidad debe ser mayor que cero'); return; }
  if(currentStoreForCart !== null && currentStoreForCart !== storeId){
    if(!confirm(`Tu carrito tiene productos de "${cart[0].store_name}". ¿Vaciar el carrito y comprar en "${storeName}" en su lugar? (Cada tienda gestiona pedidos por separado)`)) return;
    cart = [];
  }
  currentStoreForCart = storeId;
  const existing = cart.find(i => i.product_id === productId);
  if(existing && existing.quantity + quantity > stock){
    alert(`Solo quedan ${stock - existing.quantity} unidades disponibles para agregar`); return;
  }
  if(existing){ existing.quantity += quantity; }
  else{ cart.push({product_id: productId, name, quantity, price, store_id: storeId, store_name: storeName}); }
  updateCartBar();
  closeDetail();
}

function updateCartBar(){
  const bar = document.getElementById('cart-bar');
  if(cart.length === 0){ bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  const count = cart.reduce((s,i) => s + i.quantity, 0);
  const total = cart.reduce((s,i) => s + i.quantity * i.price, 0);
  document.getElementById('cart-count').textContent = `${count} producto${count>1?'s':''} · ${cart[0].store_name}`;
  document.getElementById('cart-total').textContent = `$${total.toLocaleString('es-CO')}`;
}

function openCheckout(){
  const total = cart.reduce((s,i) => s + i.quantity * i.price, 0);
  document.getElementById('checkout-content').innerHTML = `
    <h3>Confirmar pedido</h3>
    <div style="margin-bottom:14px;">
      ${cart.map(i => `<div class="cart-item-row"><span>${i.quantity}x ${i.name}</span><span class="mono">$${(i.quantity*i.price).toLocaleString('es-CO')}</span></div>`).join('')}
      <div class="cart-item-row" style="font-weight:700;border-bottom:none;"><span>Total</span><span class="mono">$${total.toLocaleString('es-CO')}</span></div>
    </div>

    <div class="delivery-toggle">
      <button id="btn-pickup" class="active" onclick="setDeliveryMode(false)">Recoger en tienda</button>
      <button id="btn-delivery" onclick="setDeliveryMode(true)">A domicilio</button>
    </div>

    <div class="field"><label>Tu nombre</label><input type="text" id="chk-name"></div>
    <div class="field"><label>Tu teléfono</label><input type="text" id="chk-phone"></div>
    <div class="field" id="address-field" style="display:none;"><label>Dirección de entrega</label><input type="text" id="chk-address"></div>

    <button class="btn-confirm" onclick="submitOrder()">Confirmar pedido</button>
  `;
  document.getElementById('checkout-modal').style.display = 'flex';
}
function closeCheckout(){ document.getElementById('checkout-modal').style.display = 'none'; }

let isDelivery = false;
function setDeliveryMode(delivery){
  isDelivery = delivery;
  document.getElementById('btn-pickup').classList.toggle('active', !delivery);
  document.getElementById('btn-delivery').classList.toggle('active', delivery);
  document.getElementById('address-field').style.display = delivery ? 'block' : 'none';
}

async function submitOrder(){
  const name = document.getElementById('chk-name').value.trim();
  const phone = document.getElementById('chk-phone').value.trim();
  const address = isDelivery ? document.getElementById('chk-address').value.trim() : null;
  if(!name || !phone || (isDelivery && !address)){ alert('Completa todos los campos'); return; }

  const body = {
    store_id: currentStoreForCart,
    customer_name: name,
    customer_phone: phone,
    delivery_address: address,
    items: cart.map(i => ({product_id: i.product_id, quantity: i.quantity}))
  };

  try{
    const res = await fetch(`${API_URL}/orders`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    if(!res.ok){ const err = await res.json(); throw new Error(err.detail || 'No se pudo crear el pedido'); }
    const order = await res.json();
    document.getElementById('checkout-content').innerHTML = `
      <div class="success-box">
        <div class="check">✓</div>
        <h3>Pedido #${order.id} confirmado</h3>
        <p style="color:var(--muted);margin-top:8px;">${isDelivery ? 'Tu pedido va en camino a la dirección indicada.' : 'Puedes recogerlo en la tienda.'}</p>
        <button class="btn-confirm" onclick="closeCheckout(); resetCart();">Listo</button>
      </div>`;
  }catch(e){ alert(e.message); }
}

function resetCart(){
  cart = []; currentStoreForCart = null;
  updateCartBar();
}

onSearch('');
</script>
</body>
</html>
