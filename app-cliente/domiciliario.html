<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de domiciliario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1B2A41;--navy-light:#28405e;--cream:#F7F5F0;--paper:#fff;--amber:#E0A458;--green:#3F6C51;--red:#B14A42;--ink:#1B2A41;--muted:#6B7280;--line:#E4E0D6;}
  *{box-sizing:border-box} body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif} h1,h2,h3{font-family:'Sora',sans-serif;margin:0}.mono{font-family:'IBM Plex Mono',monospace}
  .auth-screen{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--navy)}.auth-card{width:min(420px,100%);background:var(--paper);padding:30px;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.28)}.eyebrow{display:block;color:#B87822;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}.auth-card h1{font-size:24px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.field{margin:16px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--cream);font:14px 'Inter',sans-serif}.primary,.secondary{width:100%;padding:12px;border:0;border-radius:7px;font-weight:700;cursor:pointer}.primary{background:var(--amber);color:var(--navy)}.secondary{margin-top:10px;background:transparent;color:var(--navy);border:1px solid var(--line)}.error{color:var(--red);font-size:13px;margin-top:12px}.toggle{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}.toggle button{border:0;background:none;color:var(--green);font-weight:700;cursor:pointer}
  #dashboard{display:none;min-height:100vh}.topbar{background:var(--navy);color:#fff;padding:22px 18px 26px;border-radius:0 0 22px 22px}.topbar-inner{max-width:720px;margin:auto;display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.topbar h1{font-size:22px}.topbar .eyebrow{color:var(--amber)}.logout{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:8px 12px;cursor:pointer}.content{width:min(720px,100%);margin:auto;padding:18px}.status-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:18px}.status-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.status-text{font:700 22px 'Sora',sans-serif;margin-top:6px}.status-dot{width:12px;height:12px;background:var(--red);border-radius:50%;display:inline-block;margin-right:8px}.status-dot.active{background:var(--green)}.switch{position:relative;width:54px;height:30px;flex:0 0 auto}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#CDD2D8;border-radius:30px;cursor:pointer;transition:.2s}.slider:before{content:'';position:absolute;width:22px;height:22px;left:4px;top:4px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked + .slider{background:var(--green)}.switch input:checked + .slider:before{transform:translateX(24px)}.info-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:14px}.info-card h2{font-size:17px;margin-bottom:14px}.info-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}.info-row:last-child{border-bottom:0}.info-row span{color:var(--muted)}
  .delivery-card{border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:12px;background:var(--paper)}.delivery-card h3{font-size:15px}.delivery-card p{color:var(--muted);font-size:13px;line-height:1.5}.delivery-actions{display:flex;gap:8px}.delivery-actions button{flex:1;padding:9px;border:0;border-radius:6px;background:var(--amber);color:var(--navy);font-weight:700;cursor:pointer}.delivery-actions .secondary-action{background:var(--cream);border:1px solid var(--line)}
</style>
</head>
<body>
<section class="auth-screen" id="auth-screen">
  <div class="auth-card">
    <span class="eyebrow">Panel de domiciliario</span>
    <h1 id="auth-title">Inicia sesión</h1>
    <p class="muted">Activa tu disponibilidad y prepárate para recibir entregas.</p>
    <div id="auth-form">
      <div class="field"><label>Correo</label><input id="auth-email" type="email" placeholder="domiciliario@correo.com"></div>
      <div class="field"><label>Contraseña</label><input id="auth-password" type="password" placeholder="••••••••"></div>
      <div id="register-fields" style="display:none"><div class="field"><label>Nombre completo</label><input id="auth-name" type="text"></div><div class="field"><label>Teléfono</label><input id="auth-phone" type="tel"></div><div class="field"><label>Vehículo</label><select id="auth-vehicle"><option value="moto">Moto</option><option value="bicicleta">Bicicleta</option><option value="carro">Carro</option></select></div></div>
      <button class="primary" id="auth-submit" onclick="submitAuth()">Entrar</button><p class="error" id="auth-error"></p>
      <div class="toggle"><span id="toggle-label">¿Aún no tienes cuenta?</span> <button onclick="toggleAuth()" id="toggle-button">Regístrate</button></div>
    </div>
  </div>
</section>
<section id="dashboard">
  <header class="topbar"><div class="topbar-inner"><div><span class="eyebrow">Domiciliario</span><h1 id="courier-name">—</h1></div><div><button class="logout" onclick="window.location.href='perfiles.html'">Perfiles</button> <button class="logout" onclick="logout()">Salir</button></div></div></header>
  <main class="content"><div class="status-card"><div><div class="status-label">Estado de disponibilidad</div><div class="status-text"><span class="status-dot" id="status-dot"></span><span id="status-text">No disponible</span></div></div><label class="switch"><input type="checkbox" id="availability-toggle" onchange="toggleAvailability(this.checked)"><span class="slider"></span></label></div><div class="info-card"><h2>Mi perfil</h2><div class="info-row"><span>Teléfono</span><strong id="courier-phone">—</strong></div><div class="info-row"><span>Vehículo</span><strong id="courier-vehicle">—</strong></div></div><div class="info-card"><h2>Entregas disponibles</h2><p class="muted">Acepta un pedido para comenzar la entrega.</p><div id="delivery-list"><p class="muted">Cargando entregas...</p></div></div></main>
</section>
<script>
const API_URL = 'https://vent-fast.onrender.com';
let isRegister = false;
let token = localStorage.getItem('courier_token');
let courier = JSON.parse(localStorage.getItem('courier_profile') || 'null');
let locationWatcher = null;

function toggleAuth(){
  isRegister = !isRegister;
  document.getElementById('auth-title').textContent = isRegister ? 'Crea tu cuenta' : 'Inicia sesión';
  document.getElementById('register-fields').style.display = isRegister ? 'block' : 'none';
  document.getElementById('auth-submit').textContent = isRegister ? 'Crear cuenta' : 'Entrar';
  document.getElementById('toggle-label').textContent = isRegister ? '¿Ya tienes cuenta?' : '¿Aún no tienes cuenta?';
  document.getElementById('toggle-button').textContent = isRegister ? 'Inicia sesión' : 'Regístrate';
  document.getElementById('auth-error').textContent = '';
}

async function submitAuth(){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const error = document.getElementById('auth-error');
  error.textContent = '';
  try{
    let response;
    if(isRegister){
      response = await fetch(`${API_URL}/auth/courier/register`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:document.getElementById('auth-name').value.trim(), email, password, phone:document.getElementById('auth-phone').value.trim(), vehicle_type:document.getElementById('auth-vehicle').value})});
      if(!response.ok) throw new Error((await response.json()).detail || 'No se pudo crear la cuenta');
    }
    response = await fetch(`${API_URL}/auth/courier/login`, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:`username=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`});
    if(!response.ok) throw new Error((await response.json()).detail || 'Credenciales inválidas');
    const data = await response.json(); token = data.access_token; courier = data.courier; localStorage.setItem('courier_token', token); localStorage.setItem('courier_profile', JSON.stringify(courier)); showDashboard();
  }catch(exception){ error.textContent = exception.message; }
}

function showDashboard(){
  if(!courier) return;
  document.getElementById('auth-screen').style.display = 'none'; document.getElementById('dashboard').style.display = 'block'; document.getElementById('courier-name').textContent = courier.name; document.getElementById('courier-phone').textContent = courier.phone; document.getElementById('courier-vehicle').textContent = courier.vehicle_type; document.getElementById('availability-toggle').checked = courier.available === true; renderAvailability(courier.available === true); loadDeliveries(); startLocationTracking();
}
function renderAvailability(active){ document.getElementById('status-text').textContent = active ? 'Disponible' : 'No disponible'; document.getElementById('status-dot').classList.toggle('active', active); }
async function toggleAvailability(available){
  const response = await fetch(`${API_URL}/couriers/me/availability?available=${available}`, {method:'PATCH', headers:{Authorization:`Bearer ${token}`} });
  if(!response.ok){ document.getElementById('availability-toggle').checked = !available; return; }
  courier = await response.json(); localStorage.setItem('courier_profile', JSON.stringify(courier)); renderAvailability(available);
}
function startLocationTracking(){
  if(locationWatcher !== null || !navigator.geolocation) return;
  locationWatcher = navigator.geolocation.watchPosition(async position => {
    const {latitude, longitude} = position.coords;
    await fetch(`${API_URL}/couriers/me/location?latitude=${latitude}&longitude=${longitude}`, {method:'PATCH', headers:{Authorization:`Bearer ${token}`} });
  }, () => {}, {enableHighAccuracy:true, maximumAge:15000, timeout:10000});
}
async function loadDeliveries(){
  const list = document.getElementById('delivery-list');
  try{
    const response = await fetch(`${API_URL}/couriers/me/orders`, {headers:{Authorization:`Bearer ${token}`} });
    if(!response.ok) throw new Error('No se pudieron cargar las entregas');
    const orders = await response.json();
    if(!orders.length){ list.innerHTML = '<p class="muted">No hay entregas disponibles por ahora.</p>'; return; }
    list.innerHTML = orders.map(order => `<article class="delivery-card"><h3>Pedido #${order.id} · ${order.store_name}</h3><p><strong>Cliente:</strong> ${order.customer_name}<br><strong>Dirección:</strong> ${order.delivery_address}<br><strong>Total:</strong> $${Number(order.total).toLocaleString('es-CO')}</p><div class="delivery-actions">${order.courier_id ? `<button onclick="updateDeliveryStatus(${order.id}, 'entregado')">Marcar entregado</button><button class="secondary-action" onclick="openMap('${encodeURIComponent(order.delivery_address)}')">Ver ruta</button>` : `<button onclick="acceptDelivery(${order.id})">Aceptar entrega</button>`}</div></article>`).join('');
  }catch(error){ list.innerHTML = `<p class="error">${error.message}</p>`; }
}
async function acceptDelivery(orderId){
  const response = await fetch(`${API_URL}/couriers/me/orders/${orderId}/accept`, {method:'POST', headers:{Authorization:`Bearer ${token}`} });
  if(!response.ok){ alert((await response.json()).detail || 'No se pudo aceptar la entrega'); return; }
  loadDeliveries();
}
async function updateDeliveryStatus(orderId, status){
  const response = await fetch(`${API_URL}/couriers/me/orders/${orderId}/status?status=${status}`, {method:'PATCH', headers:{Authorization:`Bearer ${token}`} });
  if(!response.ok){ alert('No se pudo actualizar la entrega'); return; }
  loadDeliveries();
}
function openMap(address){ window.open(`https://www.google.com/maps/search/?api=1&query=${address}`, '_blank'); }
function logout(){ if(locationWatcher !== null) navigator.geolocation.clearWatch(locationWatcher); locationWatcher = null; localStorage.removeItem('courier_token'); localStorage.removeItem('courier_profile'); token = null; courier = null; document.getElementById('dashboard').style.display = 'none'; document.getElementById('auth-screen').style.display = 'grid'; }
if(token && courier) showDashboard();
</script>
</body>
</html>
